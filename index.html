 window._toggleEditMode=function(){_editMode=!_editMode;render();};
function _slotInfo(val){if(!val)return null;if(typeof val==='string')return {data:val,name:'',isImg:val.indexOf('data:image/')===0};var t=val.type||'';return {data:val.data||'',name:val.name||'',isImg:(t.indexOf('image/')===0)||((val.data||'').indexOf('data:image/')===0)};}
function _imgSlotHtml(which,val,big){var label=which==='img'?'メイン画像':'元ファイル';var dz='ondragover="_imgOver(event)" ondragleave="_imgLeave(event)" ondrop="_imgDrop(event,&#39;'+which+'&#39;)"';var info=_slotInfo(val);var hd='<div class="imghd"><span>'+label+'</span><span><button class="ib" onclick="event.stopPropagation();_imgPick(&#39;'+which+'&#39;)">差し替え</button> <button class="ib del" onclick="event.stopPropagation();_imgClear(&#39;'+which+'&#39;)">削除</button></span></div>';if(info){var body;if(info.isImg){body='<img src="'+info.data+'" class="'+(big?'imgbig':'imgsmall')+'" onclick="_imgPick(&#39;'+which+'&#39;)">';}else{body='<div class="filechip"><span class="fcic">ファイル</span><a href="'+info.data+'" download="'+escA(info.name||'file')+'">'+esc(info.name||'(ファイル)')+'</a></div>';}return '<div class="imgslot '+(big?'':'small')+'" '+dz+'>'+hd+body+'</div>';}var msg=which==='img'?'ここに画像をドロップ、またはクリックして選択':'ここにファイルをドロップ、またはクリックして選択（画像以外もOK）';return '<div class="imgslot drop '+(big?'':'small')+'" '+dz+' onclick="_imgPick(&#39;'+which+'&#39;)"><div class="imghd"><span>'+label+'</span></div><div class="dropmsg">'+msg+'</div></div>';}
function _renderImageView(){var v=document.getElementById('imageView');if(!v)return;var L=LISTS[ACTIVE]||{};v.innerHTML=_imgSlotHtml('img',L.img||'',true)+_imgSlotHtml('src',L.src||'',false);}
function _setImgFile(file,which){if(!file)return;if(which==='img'&&(file.type||'').indexOf('image/')!==0){alert('メイン画像には画像ファイルを選んでください');return;}var rd=new FileReader();rd.onload=function(){if(!LISTS[ACTIVE])return;if(which==='img'){LISTS[ACTIVE].img=rd.result;}else{LISTS[ACTIVE].src={data:rd.result,name:(file.name||''),type:(file.type||'')};}markDirty();_renderImageView();};rd.readAsDataURL(file);}
window._imgPick=function(which){var inp=document.createElement('input');inp.type='file';if(which==='img')inp.accept='image/*';inp.onchange=function(){if(inp.files&&inp.files[0])_setImgFile(inp.files[0],which);};inp.click();};
window._imgDrop=function(ev,which){ev.preventDefault();ev.stopPropagation();var dt=ev.dataTransfer;if(dt&&dt.files&&dt.files[0])_setImgFile(dt.files[0],which);var el=ev.currentTarget;if(el)el.classList.remove('over');};
window._imgOver=function(ev){ev.preventDefault();ev.stopPropagation();var el=ev.currentTarget;if(el)el.classList.add('over');};
window._imgLeave=function(ev){var el=ev.currentTarget;if(el)el.classList.remove('over');};
window._imgClear=function(which){if(!LISTS[ACTIVE])return;if(!confirm('この画像を削除しますか？'))return;LISTS[ACTIVE][which]='';markDirty();_renderImageView();};

 window._renameList=function(i){var nm=prompt('リスト名',LISTS[i].name||'');if(nm==null)return;LISTS[i].name=(nm||'').trim()||LISTS[i].name;markDirty();render();};
 window._delList=function(i){if(LISTS.length<=1){alert('最後のリストは削除できません');return;}if(!confirm('「'+(LISTS[i].name||'')+'」を削除しますか？'))return;collect();LISTS.splice(i,1);if(ACTIVE>=LISTS.length)ACTIVE=LISTS.length-1;DATA=LISTS[ACTIVE].rows||(LISTS[ACTIVE].rows=[]);markDirty();render();};
 
window._add=function(){closeMenus();collect();DATA.push({place:((OPTS[1]&&OPTS[1].v)||''),place2:'',item:'',purpose:''});markDirty();render();};
 var dragIdx=-1;
 function _clearDO(){var trs=document.querySelectorAll('#tbody tr');for(var k=0;k<trs.length;k++)trs[k].classList.remove('dragover');}
 window._dragStart=function(e,i){dragIdx=i;try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',''+i);}catch(_e){}};
 window._dragOver=function(e){e.preventDefault();try{e.dataTransfer.dropEffect='move';}catch(_e){}};
 window._dEnter=function(tr){if(tr&&tr.classList)tr.classList.add('dragover');};
 window._dLeave=function(tr){if(tr&&tr.classList)tr.classList.remove('dragover');};
 window._dragEnd=function(){dragIdx=-1;_clearDO();};
 window._drop=function(e,i){e.preventDefault();_clearDO();var from=dragIdx;if(from<0){var d=parseInt(e.dataTransfer.getData('text/plain'),10);from=isNaN(d)?-1:d;}dragIdx=-1;if(from<0||from===i)return;collect();var mv=DATA.splice(from,1)[0];DATA.splice(i,0,mv);markDirty();render();};
 window._save=function(){collect();try{localStorage.setItem('adcheck_analyze_lists',snap());}catch(e){} try{if(op&&op._analyzeSave2)op._analyzeSave2({lists:LISTS,active:ACTIVE});}catch(e){} BASE=snap();dirty=false;var st=document.getElementById('status');if(st){st.textContent='保存しました';st.className='';}setTimeout(setStatus,1300);};
 window._cancel=function(){collect();if(snap()!==BASE){if(!confirm('変更を破棄しますか？'))return;}try{var _o=JSON.parse(BASE);LISTS=_o.lists;ACTIVE=_o.active||0;if(ACTIVE>=LISTS.length)ACTIVE=0;DATA=LISTS[ACTIVE].rows;}catch(e){}dirty=false;render();setStatus();};
 window.addEventListener('beforeunload',function(e){collect();if(snap()!==BASE){e.preventDefault();e.returnValue='';return '';}});
 document.addEventListener('click',closeMenus);
 render();
 setStatus();
})();
</script></body></html>
